# The SDK contract kit check (CTR-02): pull the digest-pinned private docql-stub
# image with this repo's own GITHUB_TOKEN and prove that the kit it serves over HTTP
# equals the vendored copy in contract/ (D-07). Phases 11-13 extend this workflow to
# run the full SDK case list against the same pinned stub.
name: contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  contract-access:
    name: contract-access
    # Fork PRs skip the job, so a fork never gets the private image through a PR run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: served kit equals vendored kit (D-07)
        run: scripts/bump-stub.sh --verify
