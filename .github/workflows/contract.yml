# The SDK contract kit check (CTR-02): pull the digest-pinned private docql-stub
# image with this repo's own GITHUB_TOKEN and prove that the kit it serves over HTTP
# equals the vendored copy in contract/ (D-07). Since Phase 12 the workflow also runs
# the full shared SDK case list against the same pinned stub, gated on the vendored
# PASS count and refusing any FAIL or SKIP, plus the README quickstart (contract-cases),
# and since v0.2 every stub-target kit v3 job case, gated on the jq count (JSDK-04),
# and the README jobs example, and it is reusable so release.yml runs it on a tag.
name: contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  contract-access:
    name: contract-access
    # Fork PRs skip the job, so a fork never gets the private image through a PR run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: served kit equals vendored kit (D-07)
        run: scripts/bump-stub.sh --verify

  contract-cases:
    name: contract-cases
    # Same fork guard as contract-access: the pinned stub image is private.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: shared case list against the pinned stub
        run: |
          set -euo pipefail
          WANT=$(jq '[.cases[] | select(.via == "sdk" or .via == "raw")] | length' contract/sdk-cases.json)
          scripts/stub-up.sh --run env DOCQL_REQUIRE_STUB=1 go test -count=1 -shuffle=on -run '^TestContract' -v . | tee "$RUNNER_TEMP/contract.log"
          pass_count=$(grep -cE '^    --- PASS: TestContract(SDK|Raw)Cases/' "$RUNNER_TEMP/contract.log" || true)
          if [ "$pass_count" -ne "$WANT" ]; then
            echo "expected $WANT TestContract(SDK|Raw)Cases PASS lines, saw $pass_count" >&2
            exit 1
          fi
          # JSDK-04: every stub-target kit v3 job case with via submit, poll, cancel or
          # wait must pass as its own TestContractJobCases subtest; a silently missing
          # case fails the run.
          WANT_JOBS=$(jq '[.cases[] | select(.target == "stub" and (.via == "submit" or .via == "poll" or .via == "cancel" or .via == "wait"))] | length' contract/job-cases.json)
          n=$(grep -cE '^    --- PASS: TestContractJobCases/' "$RUNNER_TEMP/contract.log" || true)
          if [ "$WANT_JOBS" -eq 0 ] || [ "$n" -ne "$WANT_JOBS" ]; then
            echo "expected $WANT_JOBS TestContractJobCases PASS lines, saw $n" >&2
            exit 1
          fi
          if grep -Eq -- '--- (FAIL|SKIP)' "$RUNNER_TEMP/contract.log"; then
            echo "the contract run has FAIL or SKIP lines" >&2
            exit 1
          fi
          echo "contract-cases: $pass_count/$WANT case subtests and $n/$WANT_JOBS job case subtests PASS, no FAIL/SKIP"
      - name: README quickstart
        run: scripts/stub-up.sh --run scripts/run-readme.sh
      - name: README jobs example
        run: scripts/stub-up.sh --run scripts/run-readme.sh --block jobs
